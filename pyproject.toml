[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iaah"
dynamic = ["version"]  # iaah.__version__
description = "Read German bank statements (ING PDF, generic CSV), categorize, review and chart spending."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
# Own license plus third-party notices (ported code from "budgets", MIT).
license-files = ["LICENSE", "LICENSES/*.txt"]
dependencies = [
    "pdfplumber>=0.11",
    "pypdf>=5.0",
    "reportlab>=4.2",
    "Pillow>=11.0",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
    "cryptography>=43.0",
    "platformdirs>=4.3",
]

[project.optional-dependencies]
# Tooling is pinned so lint and type results do not depend on the installed version.
dev = [
    "pytest>=8.3",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "types-openpyxl",
    "types-reportlab",
]
build = ["pyinstaller>=6.11"]

[project.scripts]
iaah-cli = "iaah.cli:main"

[project.gui-scripts]
iaah = "iaah.gui.app:main"

[tool.setuptools.dynamic]
version = { attr = "iaah.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iaah = ["data/*.json"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Design notes, whose code blocks are deliberately compact pseudo-code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "BLE", "SIM", "RET", "C90", "N",
    "ANN", "PL", "PTH", "RUF", "ERA", "T20", "D100", "D104", "TID252",
]
# Typographic characters used deliberately in German UI text.
allowed-confusables = ["–", "×"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 10
max-statements = 30
# Flag magic strings and bytes in comparisons too, not only numbers.
allow-magic-value-types = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
"src/iaah/cli.py" = ["T201"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]

# typeshed leaves some tkinter methods (Notebook.select, Listbox.curselection) and matplotlib's
# Tk backend untyped; everything of ours stays fully typed. Only the modules that call Tk get
# this exception – session, viewmodel, host and texts are checked without it.
[[tool.mypy.overrides]]
module = [
    "iaah.gui.app", "iaah.gui.exports", "iaah.gui.importer", "iaah.gui.startup",
    "iaah.gui.theme", "iaah.gui.widgets", "iaah.gui.dialogs.*", "iaah.gui.tabs.*",
]
disallow_untyped_calls = false

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib", "--strict-markers"]
xfail_strict = true
filterwarnings = ["error"]
